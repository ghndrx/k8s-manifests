# HorizontalPodAutoscaler with Custom Application Metrics
# Use for: APIs, queue workers, event-driven services
# Strategy: Scale based on application-level metrics (RPS, queue depth, latency)
# Requires: Prometheus Adapter, KEDA, or custom metrics API
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-custom-metrics-hpa
  labels:
    app.kubernetes.io/component: hpa
    app.kubernetes.io/part-of: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deployment
  
  minReplicas: 3
  maxReplicas: 50
  
  metrics:
    # Custom metric: requests per second per pod
    # Requires Prometheus Adapter configured with this metric
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          # Scale up when each pod handles > 100 RPS
          averageValue: "100"
    
    # Custom metric: P99 latency
    - type: Pods
      pods:
        metric:
          name: http_request_duration_p99_seconds
        target:
          type: AverageValue
          # Scale up when P99 latency exceeds 500ms
          averageValue: "0.5"
    
    # External metric: queue depth (from external system)
    # Useful for worker pods processing from RabbitMQ, SQS, etc.
    - type: External
      external:
        metric:
          name: rabbitmq_queue_messages_ready
          selector:
            matchLabels:
              queue: processing-queue
        target:
          type: AverageValue
          # Target 10 messages per pod in queue
          averageValue: "10"
    
    # Fallback: CPU as safety net
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
---
# Prometheus Adapter ConfigMap example for custom metrics
# Deploy this alongside the HPA
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: monitoring
data:
  config.yaml: |
    rules:
      # Convert Prometheus http_requests_total to per-pod RPS
      - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^(.*)_total$"
          as: "${1}_per_second"
        metricsQuery: 'rate(<<.Series>>{<<.LabelMatchers>>}[2m])'
      
      # P99 latency histogram
      - seriesQuery: 'http_request_duration_seconds_bucket{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          as: "http_request_duration_p99_seconds"
        metricsQuery: 'histogram_quantile(0.99, rate(<<.Series>>{<<.LabelMatchers>>}[5m]))'
